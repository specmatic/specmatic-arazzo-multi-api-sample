version: 3
systemUnderTest:
  service:
    $ref: "#/components/services/product"
    runOptions:
      $ref: "#/components/runOptions/productTest"
specmatic:
  settings:
    test:
      schemaResiliencyTests: all
      strictMode: true
  governance:
    report:
      formats: [ctrf, html]
      outputDirectory: build/reports/specmatic
    successCriteria:
      minCoveragePercentage: 100
      maxMissedOperationsInSpec: 0
      enforce: true
components:
  services:
    product:
      description: Products GraphQL API
      definitions:
        - definition:
            source:
              filesystem:
                directory: ../../../specifications/graphql
            specs:
              - spec:
                  id: product
                  path: product.graphqls
  runOptions:
    productTest:
      graphqlsdl:
        type: test
        specs:
          - spec:
              id: product
              host: product
              port: 4000

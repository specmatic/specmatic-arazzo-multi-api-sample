version: 3
systemUnderTest:
  service:
    $ref: "#/components/services/location"
    runOptions:
      $ref: "#/components/runOptions/locationTest"
    data:
      examples:
        - directories:
            - "{LOCATION_EXAMPLES_PATH:examples}"
specmatic:
  settings:
    test:
      schemaResiliencyTests: "{LOCATION_SCHEMA_RESILIENCY:none}"
      strictMode: false
  governance:
    report:
      formats: [ctrf, html]
      outputDirectory: build/reports/specmatic
    successCriteria:
      minCoveragePercentage: 100
      maxMissedOperationsInSpec: 0
      enforce: true
components:
  services:
    location:
      description: Location gRPC service
      definitions:
        - definition:
            source:
              filesystem:
                directory: ../../../specifications/grpc
            specs: [location/v1/location.proto]
  runOptions:
    locationTest:
      protobuf:
        type: test
        host: location
        port: 50051
        importPaths:
          - ../../../specifications/grpc
        protocVersion: 3.23.4
        requestTimeout: 5000

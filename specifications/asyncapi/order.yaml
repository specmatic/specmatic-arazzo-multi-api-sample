asyncapi: 3.0.0

info:
  title: Order Processing Workflow
  version: 1.0.0
  description: >
    Request/reply flow for creating an order between the Order App and Order Service.
  contact:
    name: Specmatic
    url: https://specmatic.io
    email: specmatic@devs.io
  license:
    name: MIT
  tags:
    - name: Products

servers:
  localKafka:
    host: localhost:9092
    protocol: kafka
    description: Development server

channels:
  newOrders:
    address: new-orders
    messages:
      orderRequest:
        $ref: "#/components/messages/OrderRequest"

  wipOrders:
    address: wip-orders
    messages:
      wipStatus:
        $ref: "#/components/messages/WipStatus"

operations:
  createOrder:
    description: Handles a new order request
    action: receive
    channel:
      $ref: "#/channels/newOrders"
    messages:
      - $ref: "#/channels/newOrders/messages/orderRequest"
    reply:
      channel:
        $ref: "#/channels/wipOrders"
      messages:
        - $ref: "#/channels/wipOrders/messages/wipStatus"

components:
  messages:
    OrderRequest:
      name: OrderRequest
      title: New Order Request
      contentType: application/json
      correlationId:
        location: "$message.header#/requestId"
      headers:
        type: object
        properties:
          requestId:
            type: string
            format: uuid
        required:
          - requestId
      payload:
        type: object
        required:
          - userId
          - productId
          - inventory
        properties:
          userId:
            type: integer
          productId:
            type: integer
          inventory:
            type: integer

    WipStatus:
      name: WipStatus
      title: Work-In-Progress Status
      contentType: application/json
      correlationId:
        location: "$message.header#/requestId"
      headers:
        type: object
        properties:
          requestId:
            type: string
            format: uuid
        required:
          - requestId
      payload:
        type: object
        required:
          - orderId
          - status
        properties:
          orderId:
            type: integer
          status:
            type: string
            enum: ["PENDING"]


openapi: 3.0.3

info:
  title: Order Service API
  version: 1.0.0
  description: A service to manage orders and retrieve detailed order information.
  contact:
    name: Specmatic
    email: specmatic@devs.io

servers:
  - url: http://localhost:3002
    description: Local development server
  - url: http://host.docker.internal:3002
    description: Local development server

tags:
  - name: Order

paths:
  /orders/out-for-delivery:
    post:
      summary: Accept and dispatch an order
      description: Marks an inventory-reserved order as accepted and out for delivery.
      operationId: acceptAndDispatchOrder
      tags:
        - Order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutForDeliveryRequest"
      responses:
        "200":
          description: Order accepted and marked as out for delivery.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "404":
          description: Order not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    OutForDeliveryRequest:
      type: object
      required:
        - orderId
      properties:
        orderId:
          type: integer
    OrderResponse:
      type: object
      required:
        - orderId
        - userId
        - productId
        - status
      properties:
        orderId:
          type: integer
          description: The unique identifier of the order.
        userId:
          type: integer
          description: The unique identifier of the user who placed the order.
        productId:
          type: integer
          description: The unique identifier of the product.
        inventory:
          type: integer
          example: 2
        status:
          type: string
          enum:
            - PENDING
            - ACCEPTED
            - OUT_FOR_DELIVERY
          example: "PENDING"
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: "INVALID_ORDER_ID"
        message:
          type: string
          example: "The provided orderId is not a valid UUID."

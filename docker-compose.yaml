name: arazzo-demo
services:
  # ---------------------------------------------------------------------------
  # Specmatic Studio
  # ---------------------------------------------------------------------------
  studio:
    image: ${STUDIO_IMAGE:-specmatic/enterprise:latest}
    command: ["studio"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9000:9000"
    volumes:
      - ./specifications:/usr/src/app
      - ${SPECMATIC_HOME:-${HOME}/.specmatic}:/specmatic:ro
    environment:
      - PROTOC_VERSION=${PROTOC_VERSION:-3.21.8}

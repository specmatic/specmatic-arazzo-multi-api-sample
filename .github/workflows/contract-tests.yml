name: Contract tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.72.0'

      - uses: astral-sh/setup-uv@v6
        with:
          version: latest

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Validate gRPC contracts
        working-directory: specifications/grpc
        run: |
          buf lint
          buf build
          buf generate

      - name: Check generated gRPC bindings
        run: git diff --exit-code -- services/location/generated

      - name: Run isolated provider contracts
        run: uv run pytest tests/contracts -v

      - name: Upload Specmatic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: specmatic-reports
          path: build/reports/specmatic
          if-no-files-found: ignore
